[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memoria"
version = "1.0.0"
description = "Local-first cognitive memory engine for LLMs"
readme = "README.md"
authors = [{name = "Cole Stanyer", email = "Kitzkatz-memoria@proton.me"}]
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.7.4",
    "sentence-transformers==5.6.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.0",
    "rank-bm25>=0.2.2",
    "pdfplumber>=0.10.0",
    "tree-sitter>=0.20.0",
    "tree-sitter-language-pack==0.9.1",
    "mcp>=2.2.0",
    "obsidianmd-parser>=0.4.1",
    "pluggy>=1.6,<2.0",
    "aiohttp>=3.8.0",
    "orjson>=3.9.0",
    "tenacity>=8.2.0",
    "psutil>=5.9.0",
    "watchdog>=3.0.0",
    "scipy>=1.10.0",
    "jinja2>=3.1.0",
    "pytest>=8.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
memory = "cli:main"
memory-tui = "tui:main"
memoria-mcp = "memoria_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = {find = {where = ["."], include = ["*"]}}
