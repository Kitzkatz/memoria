[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-daemon"
version = "0.3.0"
description = "Local-first cognitive memory engine for LLMs"
readme = "README.md"
authors = [{name = "Your Name", email = "you@example.com"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
    "requests>=2.28.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
memory = "cli:main"
memory-tui = "tui:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = {find = {where = [".",], include = ["*"]}}

# Alternatively, to include all subfolders:
# packages = find_packages(where=".")
